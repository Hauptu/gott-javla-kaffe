name: Generate Pinterest PNGs

on:
  push:
    paths:
      - "assets/pinterest/*.svg"
      - ".github/workflows/generate-pinterest-png.yml"
      - "scripts/render-pinterest-png.py"
      - "scripts/update-pinterest-art.py"
      - "rss.xml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg==2.7.1

      - name: Update Pinterest artwork
        run: python scripts/update-pinterest-art.py

      - name: Render PNGs
        run: python scripts/render-pinterest-png.py

      - name: Commit Pinterest assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pinterest/*.svg assets/pinterest/*.png rss.xml
          if git diff --cached --quiet; then
            echo "No Pinterest asset changes."
          else
            git commit -m "Uppdatera Pinterest-bilder"
            git push
          fi
