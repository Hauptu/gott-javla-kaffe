name: Generate Pinterest PNGs

on:
  push:
    paths:
      - "assets/pinterest/*.svg"
      - ".github/workflows/generate-pinterest-png.yml"
      - "scripts/render-pinterest-png.mjs"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install renderer
        run: npm install --no-save sharp@0.33.5

      - name: Render PNGs
        run: node scripts/render-pinterest-png.mjs

      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pinterest/*.png
          if git diff --cached --quiet; then
            echo "No PNG changes."
          else
            git commit -m "Generera PNG-bilder för Pinterest"
            git push
          fi
